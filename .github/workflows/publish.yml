name: Publish to npm

# Invoked only via workflow_call from release-please.yml so that workflow stays
# the single OIDC entry point npm trusts. npm trusted publishing matches the
# top-level (entry) workflow, not the reusable one it calls, so this file must
# not be triggered directly.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Release tag to publish from'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Validate ref is a version tag
        run: |
          REF="${{ inputs.ref }}"
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "::error::ref must be a version tag (e.g. v1.2.3); got '$REF'."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ""
